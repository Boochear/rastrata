<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Настройки</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="settings-body">
    <div id="titlebar">
        <div id="titlebar-label" data-i18n="settings.title">Настройки</div>
        <div id="titlebar-controls">
            <span id="btn-close" class="titlebar-btn" role="button" title="Закрыть"></span>
        </div>
    </div>

    <div style="padding: 12px;">
        <div class="row">
            <span>1. <span data-i18n="settings.autostart"></span></span>
            <input type="checkbox" id="setting-autostart" class="checkbox">
        </div>
        <div class="row">
            <span>2. <span data-i18n="settings.tray"></span></span>
            <input type="checkbox" id="setting-tray" class="checkbox">
        </div>
        <div class="row">
            <span>3. <span data-i18n="settings.shortcut"></span></span>
            <button id="setting-shortcut" class="btn" data-i18n="btn.create"></button>
        </div>
        <div class="row">
            <span>4. <span data-i18n="settings.icons"></span></span>
            <input type="checkbox" id="setting-icons" class="checkbox">
        </div>
        <div class="row" id="theme-selector">
            <span>5. <span data-i18n="settings.theme"></span></span>
            <button id="theme-btn" class="btn">Белая ▾</button>
            <div id="theme-dropdown" class="dropdown-menu hidden"></div>
        </div>
        <div class="row" id="font-selector">
            <span>6. <span data-i18n="settings.font"></span></span>
            <button id="font-btn" class="btn">Montserrat ▾</button>
            <div id="font-dropdown" class="dropdown-menu hidden"></div>
        </div>
        <div class="row">
            <span>7. <span data-i18n="settings.export"></span></span>
            <button id="setting-export" class="btn" data-i18n="btn.export"></button>
        </div>
        <div class="row" id="lang-selector">
            <span>8. <span data-i18n="settings.language"></span></span>
            <button id="lang-btn" class="btn"></button>
            <div id="lang-dropdown" class="dropdown-menu hidden"></div>
        </div>
        <div class="row">
            <span>9. <span data-i18n="settings.holiday"></span></span>
            <input type="checkbox" id="setting-holiday" class="checkbox">
        </div>
        <div class="row">
            <span>10. <span data-i18n="settings.seasonal"></span></span>
            <input type="checkbox" id="setting-seasonal" class="checkbox">
        </div>
        <div class="row">
            <span>11. <span data-i18n="settings.autonight"></span></span>
            <input type="checkbox" id="setting-autonight" class="checkbox">
        </div>
        <div class="row" id="night-theme-selector">
            <span>12. <span data-i18n="settings.nighttheme"></span></span>
            <button id="night-theme-btn" class="btn"></button>
            <div id="night-theme-dropdown" class="dropdown-menu hidden"></div>
        </div>
        <div class="row">
            <span>13. <span data-i18n="settings.nighthours"></span></span>
            <span class="time-range">
                <span class="time-picker">
                    <button id="night-from-btn" class="btn time-btn"></button>
                    <div id="night-from-pop" class="dropdown-menu time-pop hidden">
                        <div class="time-col" data-col="h"></div>
                        <div class="time-col" data-col="m"></div>
                    </div>
                </span>
                <span>–</span>
                <span class="time-picker">
                    <button id="night-to-btn" class="btn time-btn"></button>
                    <div id="night-to-pop" class="dropdown-menu time-pop hidden">
                        <div class="time-col" data-col="h"></div>
                        <div class="time-col" data-col="m"></div>
                    </div>
                </span>
            </span>
        </div>
        <div class="row">
            <span>14. <span data-i18n="settings.blur"></span></span>
            <span class="range-wrap">
                <input type="range" id="setting-blur" class="range" min="0" max="30" step="1">
                <span id="blur-value" class="range-value"></span>
            </span>
        </div>

        <div class="dev-info">
            <img src="../media/avatar.jpg" alt="avatar" class="dev-avatar">
            <div class="dev-quote">я хочу смерти людям</div>
            <div class="dev-contacts">
                <a href="#" class="dev-contact" id="contact-telegram">
                    <img src="../media/telegram.svg" class="contact-icon" alt="telegram">
                    <span>Telegram · @boochear</span>
                </a>
                <a href="#" class="dev-contact" id="contact-email">
                    <img src="../media/gmail.svg" class="contact-icon" alt="email">
                    <span>Email · b0ochear2208@gmail.com</span>
                </a>
            </div>
        </div>

        <div id="app-footer">2026 · Rastrata</div>

        <script src="settings.js" defer></script>
</body>

</html>

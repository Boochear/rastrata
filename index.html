<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Растрата</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="titlebar">
        <span id="titlebar-label" data-i18n="app.title">Растрата</span>
        <div id="titlebar-controls">
            <span id="btn-minimize" class="titlebar-btn" role="button" title="Свернуть"></span>
            <span id="btn-close" class="titlebar-btn" role="button" title="Закрыть"></span>
        </div>
    </div>

    <div id="period-selector">
        <div id="toolbar-row">
            <button id="period-btn" class="btn">Сегодня ▾</button>
            <button id="btn-viz" class="btn" data-i18n="main.viz">Визуализация</button>
            <button id="btn-settings" class="btn" data-i18n="main.settings">Настройки</button>
        </div>
        <div id="period-dropdown" class="dropdown-menu hidden">
            <div class="dropdown-item" data-period="today" data-i18n="period.today"></div>
            <div class="dropdown-item" data-period="yesterday" data-i18n="period.yesterday"></div>
            <div class="dropdown-item" data-period="last7" data-i18n="period.last7"></div>
            <div class="dropdown-item" data-period="last30" data-i18n="period.last30"></div>
            <div class="dropdown-item" data-period="lastyear" data-i18n="period.lastyear"></div>
            <div class="dropdown-item" data-period="all" data-i18n="period.all"></div>
        </div>
    </div>

    <div id="list"></div>
    <script src="renderer.js" defer></script>
</body>

</html>

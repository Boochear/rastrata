<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Tray</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        html,
        body {
            background: transparent !important;
        }

        body::before,
        body::after {
            display: none !important;
        }

        #tray-menu {
            display: inline-block;
            box-sizing: border-box;
            min-width: 140px;
            padding: 4px 0;
            white-space: nowrap;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
        }

        .tray-sep {
            height: 1px;
            margin: 4px 8px;
            background: var(--border);
            opacity: .6;
        }
    </style>
</head>

<body>
    <div id="tray-menu"></div>
    <script src="tray.js" defer></script>
</body>

</html>

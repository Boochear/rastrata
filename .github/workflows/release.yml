name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: package.nw

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Sync version in package.json
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='package.nw/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='${{ steps.version.outputs.VERSION }}';fs.writeFileSync(f,JSON.stringify(p,null,2));"

      - name: Cache NW.js
        id: nwcache
        uses: actions/cache@v4
        with:
          path: nwjs-extracted
          key: nwjs-0.115.0-win-x64

      - name: Download NW.js runtime
        if: steps.nwcache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $nwVersion = "0.115.0"
          $url = "https://dl.nwjs.io/v$nwVersion/nwjs-v$nwVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile nwjs.zip
          Expand-Archive -Path nwjs.zip -DestinationPath nwjs-extracted

      - name: Clean user data from package.nw
        shell: powershell
        run: |
          $files = @('stats.json','settings.json','names.json','icons.json','fonts.json','tray.flag','debug-tray.log','.gitignore','.gitattributes')
          foreach ($f in $files) {
            $path = "package.nw\$f"
            if (Test-Path $path) { Remove-Item $path -Force }
          }
          foreach ($d in @('.git','.github')) {
            $path = "package.nw\$d"
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

      - name: Build update archive
        shell: powershell
        run: |
          Compress-Archive -Path package.nw -DestinationPath "Rastrata-${{ steps.version.outputs.VERSION }}-update.zip"

      - name: Build full archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path staging
          $nwFolder = Get-ChildItem -Path nwjs-extracted -Directory | Select-Object -First 1
          Copy-Item -Path "$($nwFolder.FullName)\*" -Destination staging -Recurse -Force
          Rename-Item -Path "staging\nw.exe" -NewName "Rastrata.exe"
          Copy-Item -Path package.nw -Destination staging\package.nw -Recurse

      - name: Set exe metadata and icon
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe

          .\rcedit.exe "staging\Rastrata.exe" --set-version-string "FileDescription" "Rastrata"
          .\rcedit.exe "staging\Rastrata.exe" --set-version-string "ProductName" "Rastrata"
          .\rcedit.exe "staging\Rastrata.exe" --set-version-string "CompanyName" "boochear"
          .\rcedit.exe "staging\Rastrata.exe" --set-version-string "LegalCopyright" "Copyright (c) 2026 boochear"
          .\rcedit.exe "staging\Rastrata.exe" --set-file-version "${{ steps.version.outputs.VERSION }}"
          .\rcedit.exe "staging\Rastrata.exe" --set-product-version "${{ steps.version.outputs.VERSION }}"
          .\rcedit.exe "staging\Rastrata.exe" --set-icon "staging\package.nw\media\icon.ico"

      - name: Compress full archive
        shell: powershell
        run: |
          Compress-Archive -Path staging\* -DestinationPath "Rastrata-${{ steps.version.outputs.VERSION }}-win-x64-full.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rastrata v${{ steps.version.outputs.VERSION }}
          draft: false
          files: |
            Rastrata-${{ steps.version.outputs.VERSION }}-update.zip
            Rastrata-${{ steps.version.outputs.VERSION }}-win-x64-full.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}